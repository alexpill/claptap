[package]
name = "claptap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A typing test for the terminal, with stats and graphs"
license = "MIT"
repository = "https://github.com/alexpill/claptap"
keywords = ["typing", "tui", "terminal", "wpm"]
categories = ["command-line-utilities", "games"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
